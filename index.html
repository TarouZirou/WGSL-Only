<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>WGSL Editor</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div id="layout">
			<div id="vertical">
				<canvas id="canvas"></canvas>
				<div id="console"></div>
			</div>
			<div id="container"></div>
		</div>

		<div id="buttons"></div>
		<script
			id="monaco-loader"
			src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"
		></script>
		<script>
			// diagnostics for loader.js
			const _s = document.getElementById("monaco-loader");
			if (_s) {
				_s.addEventListener("load", () =>
					console.log("monaco loader.js loaded (script tag)"),
				);
				_s.addEventListener("error", (e) =>
					console.error(
						"monaco loader.js failed to load (script tag)",
						e,
					),
				);
			} else {
				console.warn("monaco loader script element not found");
			}
			console.log("About to import module ./dist/index.js");
		</script>
		<script type="module" src="./dist/index.js"></script>
	</body>
</html>
